# Forecast Studio: PostgreSQL (seeded with dummy data) + FastAPI + frontend.
#   docker compose up --build
# Optional .env overrides: POSTGRES_PASSWORD, API_SECRET_KEY, DEMO_USERNAME,
# DEMO_PASSWORD, SEED_STATES, SEED_FROM. Re-seed: docker compose run --rm seed python -m db.seed --force

x-db-env: &db-env
  DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-forecast}:${POSTGRES_PASSWORD:-forecast}@postgres:5432/${POSTGRES_DB:-forecast_studio}"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forecast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forecast}
      POSTGRES_DB: ${POSTGRES_DB:-forecast_studio}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # schema on first start
    ports:
      - "127.0.0.1:5432:5432"   # local inspection only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # One-shot: fills the database with dummy data (skips if already seeded).
  seed:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    command: ["python", "-m", "db.seed"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *db-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    env_file:
      - path: .env
        required: false
    environment:
      <<: *db-env
      PORT: "8000"
      # Immutable forecast records survive redeploys on the mounted exports volume.
      FORECAST_RECORDS_DIR: "/app/exports/forecast_records"
    volumes:
      - ./backend/artifacts:/app/backend/artifacts
      - ./exports:/app/exports
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_FASTAPI_API_BASE_URL: /ml-api
    ports:
      - "80:80"
    depends_on:
      - fastapi
    restart: unless-stopped

volumes:
  pgdata:
