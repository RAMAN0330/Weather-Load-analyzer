[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
  ".git",
  ".idea",
  ".venv",
  "venv",
  "env",
  "__pycache__",
  "node_modules",
  "frontend/node_modules",
  "frontend/dist",
  "graphify-out",
  "exports",
  "weather_load_processor.py",
]

[tool.ruff.lint]
# Keep this intentionally conservative: correctness + import hygiene.
select = ["F", "E9", "W6", "I"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]
combine-as-imports = true
